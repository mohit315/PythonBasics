[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-basics-lessons"
version = "0.1.0"
description = "Small, tested Python beginner lessons"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools]
py-modules = ["FirstDemo", "DataTypeOperations"]

[tool.setuptools.packages.find]
include = ["lessons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
